[toolchain]
anchor_version = "0.31.1"
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.devnet]
recvfund = "FAZUvvc2anrhgkP6sVczAHp2wkFCfhzpFcbiBt1mVM8J"

[programs.localnet]
recvfund = "FAZUvvc2anrhgkP6sVczAHp2wkFCfhzpFcbiBt1mVM8J"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
