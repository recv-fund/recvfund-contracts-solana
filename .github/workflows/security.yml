name: Solana security
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: solana-security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - name: Units, static checks, complete dependency scan, verified SBF and validator
        run: bash scripts/security-check.sh
        env:
          RECVFUND_VERIFIED_BUILD: '1'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: solana-security-${{ github.sha }}
          path: security/artifacts/
          if-no-files-found: error
          retention-days: 30
