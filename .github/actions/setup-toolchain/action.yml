name: Pinned Solana toolchain
description: Install checksum-verified Solana, Anchor, audit and verified-build tools
runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '22.14.0'
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.12.9'
    - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
      with:
        toolchain: '1.85.1'
        components: rustfmt, clippy
    - shell: bash
      run: bash scripts/install-ci-tools.sh
