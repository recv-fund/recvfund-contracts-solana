[package]
name = "recvfund"
version = "0.1.0"
description = "recv.fund on-chain settlement program: non-custodial stablecoin payments with a capped protocol fee"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "recvfund"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
# Tested by code that Anchor's macros generate in this crate; declared so the
# compiler's cfg check knows them. None is enabled by default.
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = "0.31.1"

[lints.rust]
# Anchor's entrypoint macros test `target_os = "solana"`, which is a valid
# target for the Solana toolchain but unknown to the host compiler.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
# Anchor 0.31.1's `#[program]` macro generates the IDL account instructions
# with the deprecated `AccountInfo::realloc`. A lint level here, unlike an
# attribute in `lib.rs`, leaves the compiled program unchanged. It also hides
# deprecations in this crate's own code; remove it after upgrading Anchor.
deprecated = "allow"

